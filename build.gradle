import org.jboss.forge.roaster.Roaster
import org.jboss.forge.roaster.model.source.JavaClassSource

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.jboss.forge.roaster:roaster-jdt:2.29.0.Final'
    }
}

plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'org.frc.Main'
}

sourceSets.main.java.srcDirs += ['src/staging/java']

tasks.register('syncKoansEngine', Sync) {
    group = 'koans'

    from layout.projectDirectory.dir('../FrcJavaKoans/src/main/java')
    into layout.projectDirectory.dir('src/staging/java')
    include 'engine/**', 'sensei/**', '*PathToEnlightment.java'
}

tasks.register('syncSolutions', Sync) {
    group = 'koans'
    dependsOn tasks.syncKoansEngine

    from layout.projectDirectory.dir('src/inject/passing')
    into layout.projectDirectory.dir('src/staging/java')
    preserve {
        include 'engine/**', 'sensei/**', '*PathToEnlightment.java'
    }
}

tasks.compileJava {
    dependsOn tasks.syncSolutions
}

def classroomBundle = layout.buildDirectory.dir('classroom50/bundle')

tasks.register('stageClassroomBundle', Sync) {
    group = 'koans'
    description = 'Stage the Classroom 50 grading bundle (autograder, milestones, pristine engine and sensei)'
    dependsOn tasks.syncKoansEngine
    // Reads src/staging/java, which syncSolutions also writes (solutions only; never copied here).
    mustRunAfter tasks.syncSolutions

    into classroomBundle
    from(layout.projectDirectory.dir('classroom50')) {
        include 'autograder.py', 'milestones.json'
    }
    // Only engine/ and sensei/: staging also holds the solutions, which must never be bundled.
    from(layout.projectDirectory.dir('src/staging/java')) {
        include 'engine/**', 'sensei/**'
        into 'src'
    }
    from(layout.projectDirectory.dir('src/main/java')) {
        include 'engine/Grader.java'
        into 'src'
    }
    preserve {
        include 'koans.json'
    }
}

tasks.register('buildClassroomBundle', JavaExec) {
    group = 'koans'
    description = 'Build the Classroom 50 grading bundle in build/classroom50/bundle'
    dependsOn tasks.stageClassroomBundle, tasks.classes

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'engine.Grader'
    doFirst {
        def milestones = new groovy.json.JsonSlurper().parse(file('classroom50/milestones.json'))
        args(['--list', classroomBundle.get().file('koans.json').asFile.path] + milestones.collect { it.series })
    }
}

tasks.register('verifyClassroom', Exec) {
    group = 'koans'
    description = 'Run the Classroom 50 grading and submission tests'
    dependsOn tasks.syncKoansEngine, tasks.buildClassroomBundle

    workingDir = layout.projectDirectory
    commandLine 'bash', 'classroom50/verify.sh'
}

// Experiment to see if could be asserting failures for particular koans as well. Not used for now.
abstract class InjectKoansSources extends DefaultTask {
    @InputFile
    RegularFile sourceFile

    @TaskAction
    void action() {
        def parsedClass = Roaster.parse(JavaClassSource.class, sourceFile.asFile)
        def method = parsedClass.getMethod('sayHelloInConsole')
        parsedClass.removeMethod(method)
        def newMethod = parsedClass
            .addMethod()
            .setName(method.name)
            .setPublic()
            .setStatic(true)
            .setBody('System.out.println(\'Hello!\');')

        if (!newMethod.getReturnType().isType('void')) {
            newMethod.setReturnType(method.getReturnType())
        }
        method.parameters.each { p ->
            newMethod.addParameter(p.type.toString(), p.name)
        }
        sourceFile.asFile.withWriter { w ->
            w.print(parsedClass)
        }
    }
}

tasks.register('injectKoansSources', InjectKoansSources) {
    group = 'koans'
    description = 'Prepare the src/staging directory with a simulation of student answers'
    dependsOn tasks.syncSolutions

     sourceFile = layout.projectDirectory.dir('src/staging/java/koans/english').file('AboutConsoleAndVariables.java')
}
